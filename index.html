<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Local WebGPU</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col items-center justify-center">
  <div class="max-w-2xl w-full bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
    <h1 class="text-2xl font-bold mb-4 text-emerald-400">IA Local no Navegador</h1>
    <div id="status" class="mb-4 text-sm text-slate-300">A verificar suporte a WebGPU...</div>
    <div id="output" class="bg-slate-950 p-4 rounded-lg min-h-[150px] mb-4 text-slate-200 font-mono text-sm whitespace-pre-wrap"></div>
    <button id="btn" onclick="runAI()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition disabled:opacity-50" disabled>
      Carregar IA
    </button>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const btnEl = document.getElementById("btn");

    if (!navigator.gpu) {
      statusEl.innerText = "❌ WebGPU não é suportado neste navegador/placa de vídeo.";
      statusEl.className = "mb-4 text-sm text-red-400 font-bold";
    } else {
      statusEl.innerText = "✅ WebGPU detetado! Clica no botão para iniciar.";
      btnEl.disabled = false;
    }

    window.runAI = async () => {
      btnEl.disabled = true;
      try {
        const selectedModel = "SmolLM2-135M-Instruct-q4f16_1-MLC";
        const engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (progress) => {
            statusEl.innerText = `A carregar modelo: ${(progress.progress * 100).toFixed(0)}% (${progress.text})`;
          }
        });

        statusEl.innerText = "🚀 IA Pronta! A gerar resposta...";
        const reply = await engine.chat.completions.create({
          messages: [{ role: "user", content: "Olá! Quem és tu?" }]
        });

        outputEl.innerText = reply.choices[0].message.content;
        statusEl.innerText = "✅ Resposta gerada com sucesso!";
      } catch (err) {
        console.error(err);
        statusEl.innerText = "❌ Erro ao carregar IA: " + err.message;
      } finally {
        btnEl.disabled = false;
      }
    };
  </script>
</body>
</html>
